name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # No cache: the module has no dependencies and no go.sum yet.
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install C library development files
        # The module catalog (`zexic add`) binds real system libraries, and its
        # end-to-end tests are skip-guarded on the development headers. Installing
        # them here turns those skips into gates.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev zlib1g-dev libssl-dev libcurl4-openssl-dev libmicrohttpd-dev

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Module catalog
        # `add` with no argument lists the catalog; installing must write exactly
        # one importable module and be idempotent without --force.
        run: |
          go build -o /tmp/zexic ./cmd/zexic
          /tmp/zexic add
          work=$(mktemp -d)
          cd "$work"
          /tmp/zexic add sqlite
          test -f lib/sqlite.zx
          /tmp/zexic add sqlite && exit 1 || true   # refuses to overwrite
          /tmp/zexic add sqlite --force

      - name: Smoke test the front end
        run: go run ./cmd/zexic tokenize examples/hello.zx > /dev/null

      - name: Compile and run a program
        run: go run ./cmd/zexic run tests/tour.zx

      - name: Lower to MIR
        run: go run ./cmd/zexic emit --emit=mir tests/tour.zx > /dev/null

      - name: Check documentation examples
        # The checker prints one FAIL line per drifting block; surface them as
        # annotations so a red run says *which* example broke without needing
        # the raw log.
        run: |
          set +e
          python3 scripts/check_doc_examples.py --run 2>&1 | tee /tmp/doc-examples.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^ *(FAIL|fail)' /tmp/doc-examples.log | head -20 | while IFS= read -r line; do
              echo "::error::${line//\%/%25}"
            done
            tail -5 /tmp/doc-examples.log
          fi
          exit "$status"

      - name: Benchmark smoke test
        run: python3 bench/run_bench.py --only fib --reps 1 --out /tmp/bench-results.md
