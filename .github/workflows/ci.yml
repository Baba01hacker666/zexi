name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # No cache: the module has no dependencies and no go.sum yet.
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Smoke test the front end
        run: go run ./cmd/zexic tokenize examples/hello.zx > /dev/null

      - name: Compile and run a program
        run: go run ./cmd/zexic run tests/tour.zx

      - name: Check documentation examples
        run: python3 scripts/check_doc_examples.py --run

      - name: Benchmark smoke test
        run: python3 bench/run_bench.py --only fib --reps 1 --out /tmp/bench-results.md
